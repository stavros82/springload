name: Daily All-Time Clone Tracker

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every day at 00:00 UTC
  workflow_dispatch:      # Allows manual runs from the GitHub Actions tab

jobs:
  track-clones:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Clone Stats & Update History
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Fetch rolling 14-day traffic from GitHub API
          gh api "repos/$REPO/traffic/clones" > latest_traffic.json

          # 2. Process data, merge into history JSON, calculate total, and rewrite README
          python3 -c "
          import json, os, re
          from datetime import datetime, timezone

          # Load API response
          with open('latest_traffic.json', 'r') as f:
              latest_api = json.load(f)

          # Load or initialize history file
          history_file = 'clones_history.json'
          if os.path.exists(history_file):
              with open(history_file, 'r') as f:
                  history = json.load(f)
          else:
              history = {}

          # Store daily clone counts by date key (prevents duplicates)
          for day in latest_api.get('clones', []):
              date_key = day['timestamp'][:10]
              history[date_key] = {
                  'count': day['count'],
                  'uniques': day['uniques']
              }

          # Save updated historical JSON database
          with open(history_file, 'w') as f:
              json.dump(history, f, indent=2)

          # Calculate total all-time clones across all saved dates
          all_time_clones = sum(item['count'] for item in history.values())
          all_time_uniques = sum(item['uniques'] for item in history.values())

          # Format replacement text for README
          now_utc = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          stats_text = (
              '<!-- CLONE_STATS_START -->\n'
              f'**All-Time Clones:** {all_time_clones:,} | **All-Time Unique Cloners:** {all_time_uniques:,} '
              f'*(Last Updated: {now_utc})*\n'
              '<!-- CLONE_STATS_END -->'
          )

          # Update README.md between target tags
          if os.path.exists('README.md'):
              with open('README.md', 'r') as f:
                  readme = f.read()

              if '<!-- CLONE_STATS_START -->' in readme:
                  updated_readme = re.sub(
                      r'<!-- CLONE_STATS_START -->.*?<!-- CLONE_STATS_END -->',
                      stats_text,
                      readme,
                      flags=re.DOTALL
                  )
                  with open('README.md', 'w') as f:
                      f.write(updated_readme)
          "

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clones_history.json README.md
          git commit -m "docs: update all-time clone statistics [skip ci]" || exit 0
          git push