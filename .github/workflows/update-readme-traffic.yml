name: Daily Clone Tracker

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

jobs:
  update-clones:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch 14-Day Traffic & Update All-Time History
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Fetch current traffic from GitHub REST API
          gh api "repos/$REPO/traffic/clones" > latest_traffic.json

          # 2. Process data and update history + README via Python
          python3 -c "
          import json, os, re

          # Load latest API data
          with open('latest_traffic.json', 'r') as f:
              latest_data = json.load(f).get('clones', [])

          # Load existing historical record if it exists
          history_file = 'clones_history.json'
          if os.path.exists(history_file):
              with open(history_file, 'r') as f:
                  history = json.load(f)
          else:
              history = {}

          # Merge new daily data keyed by YYYY-MM-DD (prevents double-counting)
          for day in latest_data:
              date_key = day['timestamp'][:10]
              history[date_key] = {
                  'count': day['count'],
                  'uniques': day['uniques']
              }

          # Save updated historical JSON
          with open(history_file, 'w') as f:
              json.dump(history, f, indent=2)

          # Calculate total sum across all days stored
          total_clones = sum(item['count'] for item in history.values())
          total_uniques = sum(item['uniques'] for item in history.values())

          # Format replacement text
          stats_text = f'<!-- CLONES_START -->\n* **All-Time Clones:** {total_clones:,}\n* **All-Time Unique Cloners:** {total_uniques:,}\n<!-- CLONES_END -->'

          # Update README.md
          with open('README.md', 'r') as f:
              readme = f.read()

          if '<!-- CLONES_START -->' in readme:
              updated_readme = re.sub(r'<!-- CLONES_START -->.*?<!-- CLONES_END -->', stats_text, readme, flags=re.DOTALL)
              with open('README.md', 'w') as f:
                  f.write(updated_readme)
          "

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clones_history.json README.md
          git commit -m "chart: update daily all-time clone statistics [skip ci]" || exit 0
          git push