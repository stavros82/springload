name: Daily README Traffic Update

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Clone Stats & Inject into README
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          # Query GitHub API for 14-day clone data
          RESPONSE=$(gh api -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/traffic/clones)
          
          TOTAL_CLONES=$(echo "$RESPONSE" | jq -r '.count')
          UNIQUE_CLONERS=$(echo "$RESPONSE" | jq -r '.uniques')
          LAST_UPDATED=$(date -u +'%Y-%m-%d %H:%M UTC')

          # Construct markdown string
          STATS_TEXT="**14-Day Clones:** ${TOTAL_CLONES} | **Unique Cloners:** ${UNIQUE_CLONERS} *(Last Updated: ${LAST_UPDATED})*"

          # Inject or append into README.md
          if grep -q "<!-- CLONE_STATS_START -->" README.md; then
            sed -i "/<!-- CLONE_STATS_START -->/,/<!-- CLONE_STATS_END -->/c\<!-- CLONE_STATS_START -->\n${STATS_TEXT}\n<!-- CLONE_STATS_END -->" README.md
          else
            echo -e "\n## 📊 Repository Traffic\n<!-- CLONE_STATS_START -->\n${STATS_TEXT}\n<!-- CLONE_STATS_END -->" >> README.md
          fi

      - name: Commit and Push README Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(docs): update midnight clone metrics in README [skip ci]" || exit 0
          git push